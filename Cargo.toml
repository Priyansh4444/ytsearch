[workspace]
resolver = "3"
members = [
    "crates/youtube_api",
    "crates/youtube_cli",
    "crates/youtube_client",
    "crates/youtube_ingest",
    "crates/youtube_index_store",
    "crates/youtube_search_service",
    "crates/youtube_search_client",
    "crates/youtube_sources",
    "crates/youtube_raw_search",
    "crates/youtube_time",
    "crates/youtube_transcribe",
    "crates/youtube_ytdlp",
]

[workspace.dependencies]
async-trait = "0.1.91"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = "1.53.1"
tracing = "0.1.44"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
