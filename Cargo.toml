[workspace]
resolver = "3"
members = [
    "crates/youtube_api",
    "crates/youtube_cli",
    "crates/youtube_client",
    "crates/youtube_ingest",
    "crates/youtube_index_store",
    "crates/youtube_search_service",
    "crates/youtube_search_client",
    "crates/youtube_sources",
    "crates/youtube_raw_search",
    "crates/youtube_time",
    "crates/youtube_transcribe",
    "crates/youtube_ytdlp",
]

[workspace.dependencies]
async-trait = "0.1.91"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = "1.53.1"
tracing = "0.1.44"
