app = 'ytsearch-typesense-staging'
primary_region = 'sjc'

[build]
  image = 'typesense/typesense:30.2'

[env]
  TYPESENSE_DATA_DIR = '/typesense-data'
  TYPESENSE_API_ADDRESS = '0.0.0.0'
  TYPESENSE_API_PORT = '8108'
  TYPESENSE_ENABLE_CORS = 'false'
  TYPESENSE_ENABLE_SEARCH_ANALYTICS = 'false'
  TYPESENSE_LOG_SLOW_REQUESTS_TIME_MS = '1000'
  # Single-node recovery after an unclean shutdown or stale peer address.
  TYPESENSE_RESET_PEERS_ON_ERROR = 'true'

[mounts]
  source = 'typesense_data'
  destination = '/typesense-data'
  snapshot_retention = 30

[http_service]
  internal_port = 8108
  force_https = true
  auto_stop_machines = 'off'
  # The Cloudflare availability scheduler owns starts and stops. Keep these
  # disabled so a direct off-hours request cannot wake the paid search node.
  auto_start_machines = false
  min_machines_running = 0
  processes = ['app']

[[vm]]
  # The active corpus uses more than 3.3 GB resident memory. Fly shared CPU
  # Machines cap out at 4 GB, leaving too little headroom for indexing bursts.
  memory = '8192mb'
  cpu_kind = 'performance'
  cpus = 4

[checks]
  [checks.health]
    port = 8108
    type = 'http'
    interval = '15s'
    timeout = '2s'
    grace_period = '15s'
    method = 'get'
    path = '/health'
