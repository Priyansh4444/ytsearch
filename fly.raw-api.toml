app = 'ytsearch-api-raw-production'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile.search-api'

[env]
  YTSEARCH_API_ADDR = '0.0.0.0:8787'
  RAW_SEARCH_COLLECTION = 'youtube_transcript_chunks'
  RAW_SEARCH_API_URL = 'https://ytsearch-raw-production.fly.dev'
  YTSEARCH_INDEX_QUEUE_PATH = '/data/index-requests.jsonl'
  YTSEARCH_INDEX_REQUEST_RATE_LIMIT_PER_MINUTE = '6'
  YTSEARCH_INDEX_QUEUE_MAX_ITEMS = '10000'
  YTSEARCH_ALLOWED_ORIGINS = 'https://search.pronsh.dev'
  YTSEARCH_ENGAGEMENT_SORTS = 'true'
  YTSEARCH_BACKEND_LABEL = 'raw'
  YTSEARCH_PRESERVE_BACKEND_RELEVANCE_ORDER = 'true'
  RUST_LOG = 'youtube_api=info,tower_http=info'
  LOG_FORMAT = 'json'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[mounts]
  source = 'raw_api_queue_data'
  destination = '/data'
  initial_size = '1gb'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[checks]
  [checks.health]
    port = 8787
    type = 'http'
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'
    method = 'get'
    path = '/api/health'
