[package]
name = "youtube_cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ytsearch"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = "0.15"
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.37", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
youtube_client = { path = "../youtube_client" }
youtube_ingest = { path = "../youtube_ingest" }
youtube_sources = { path = "../youtube_sources" }
youtube_transcribe = { path = "../youtube_transcribe" }
youtube_typesense = { path = "../youtube_typesense" }
youtube_ytdlp = { path = "../youtube_ytdlp" }
