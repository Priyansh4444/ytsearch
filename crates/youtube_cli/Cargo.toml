[package]
name = "youtube_cli"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "ytsearch"
path = "src/main.rs"

[dependencies]
blake3 = "1.8"
clap = { version = "4.6", features = ["derive", "env"] }
dotenvy = "0.15.7"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
youtube_client = { path = "../youtube_client" }
youtube_ingest = { path = "../youtube_ingest" }
youtube_index_store = { path = "../youtube_index_store", features = ["http-client"] }
youtube_sources = { path = "../youtube_sources" }
youtube_transcribe = { path = "../youtube_transcribe" }
youtube_search_client = { path = "../youtube_search_client" }
youtube_ytdlp = { path = "../youtube_ytdlp" }
