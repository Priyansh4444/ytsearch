[package]
name = "youtube_raw_search"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "youtube-raw-search"
path = "src/main.rs"

[dependencies]
blake3 = "1.8"
memmap2 = "0.9"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
youtube_search_service = { path = "../youtube_search_service" }
youtube_index_store = { path = "../youtube_index_store" }
youtube_ingest = { path = "../youtube_ingest" }
youtube_time = { path = "../youtube_time" }
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
