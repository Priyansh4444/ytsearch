[package]
name = "youtube_raw_search"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "youtube-raw-search"
path = "src/main.rs"

[dependencies]
axum = "0.8"
blake3 = "1.8"
flate2 = "1.1.9"
http-body-util = "0.1"
libc = "0.2"
memmap2 = "0.9"
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
smallvec = "1.15"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio-util = { version = "0.7", features = ["io"] }
youtube_search_service = { path = "../youtube_search_service" }
youtube_index_store = { path = "../youtube_index_store" }
youtube_ingest = { path = "../youtube_ingest" }
youtube_time = { path = "../youtube_time" }
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
unicode-normalization = "0.1"
