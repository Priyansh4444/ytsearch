[package]
name = "youtube_index_store"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = { version = "1.8", optional = true }
reqwest = { workspace = true, optional = true, features = ["query", "stream"] }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true, features = ["fs", "io-util"] }
youtube_ingest = { path = "../youtube_ingest" }

[features]
http-client = ["dep:blake3", "dep:reqwest", "dep:serde_json", "dep:tokio"]

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt"] }
