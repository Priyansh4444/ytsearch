[package]
name = "youtube_ingest"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
youtube_time = { path = "../youtube_time" }

[dev-dependencies]
tokio = { version = "1.37", features = ["macros", "rt-multi-thread"] }
