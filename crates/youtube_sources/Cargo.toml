[package]
name = "youtube_sources"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.37", features = ["process", "time"] }
tracing = "0.1"
youtube_client = { path = "../youtube_client" }
youtube_ingest = { path = "../youtube_ingest" }

[dev-dependencies]
tokio = { version = "1.37", features = ["macros", "rt-multi-thread"] }
