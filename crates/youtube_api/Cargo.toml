[package]
name = "youtube_api"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "youtube-api"
path = "src/main.rs"

[dependencies]
axiom-rs = "0.11.0"
axum = "0.8"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.37", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tower-http = { version = "0.6", features = ["compression-gzip", "cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
youtube_search = { path = "../youtube_search" }
youtube_typesense = { path = "../youtube_typesense" }
