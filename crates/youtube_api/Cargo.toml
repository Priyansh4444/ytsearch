[package]
name = "youtube_api"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "youtube-api"
path = "src/main.rs"

[dependencies]
axum = "0.8"
dotenvy = "0.15"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "sync"] }
tower-http = { version = "0.6.11", features = ["compression-gzip", "cors", "trace"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
youtube_search = { path = "../youtube_search" }
youtube_typesense = { path = "../youtube_typesense" }
