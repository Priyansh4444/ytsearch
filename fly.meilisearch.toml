app = 'ytsearch-meili-staging'
primary_region = 'sjc'

[build]
  image = 'getmeili/meilisearch:v1.15'

[env]
  MEILI_ENV = 'production'
  MEILI_DB_PATH = '/meili_data/db'
  MEILI_NO_ANALYTICS = 'true'
  MEILI_HTTP_ADDR = '0.0.0.0:7700'

[mounts]
  source = 'meili_data'
  destination = '/meili_data'

[http_service]
  internal_port = 7700
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '4096mb'
  cpu_kind = 'shared'
  cpus = 2

[checks]
  [checks.health]
    port = 7700
    type = 'http'
    interval = '15s'
    timeout = '2s'
    grace_period = '15s'
    method = 'get'
    path = '/health'
