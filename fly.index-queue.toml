app = 'ytsearch-index-queue-staging'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[env]
  YTSEARCH_API_ADDR = '0.0.0.0:8787'
  YTSEARCH_SEARCH_BACKEND = 'meilisearch'
  MEILI_TRANSCRIPTS_INDEX = 'youtube_transcript_chunks'
  YTSEARCH_INDEX_QUEUE_PATH = '/data/index-requests.jsonl'
  RUST_LOG = 'youtube_api=info,tower_http=info'
  LOG_FORMAT = 'json'

[mounts]
  source = 'index_queue_data'
  destination = '/data'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[checks]
  [checks.health]
    port = 8787
    type = 'http'
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'
    method = 'get'
    path = '/api/health'
