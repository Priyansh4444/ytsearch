# Experimental semantic site. Searches try the local semantic API first; whatever
# it cannot answer semantically (low-signal queries, date sorts, semantic down)
# fails against its closed Raw port and is retried on the public production API.
# Everything else is read-only production. This site cannot queue index requests.
user www-data;
worker_processes 1;
pid /run/nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    server_tokens off;

    upstream local_api {
        server 127.0.0.1:8787;
    }

    server {
        listen 8080;
        listen [::]:8080;
        root /usr/share/nginx/html;
        index index.html;

        location = /healthz {
            return 200 "ok\n";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /api/search {
            limit_except GET HEAD { deny all; }
            proxy_pass http://local_api;
            proxy_intercept_errors on;
            error_page 500 502 503 504 = @production;
        }

        # The schedule lives in the Cloudflare Worker, not the API.
        location = /api/availability {
            limit_except GET HEAD { deny all; }
            proxy_pass https://search.pronsh.dev;
            proxy_set_header Host search.pronsh.dev;
            proxy_set_header Origin "";
            proxy_ssl_server_name on;
        }

        location /api/ {
            limit_except GET HEAD { deny all; }
            proxy_pass https://ytsearch-api-raw-production.fly.dev;
            proxy_set_header Host ytsearch-api-raw-production.fly.dev;
            proxy_set_header Origin "";
            proxy_ssl_server_name on;
        }

        location @production {
            proxy_pass https://ytsearch-api-raw-production.fly.dev;
            proxy_set_header Host ytsearch-api-raw-production.fly.dev;
            proxy_set_header Origin "";
            proxy_ssl_server_name on;
        }
    }
}
