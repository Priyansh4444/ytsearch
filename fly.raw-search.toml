app = 'ytsearch-raw-production'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile.raw-search'

[env]
  RAW_SEARCH_BIND = '0.0.0.0:8108'
  RAW_SEARCH_INDEX_PATH = '/data/index'
  RAW_SEARCH_BASE_CHUNKS_GZIP = '/data/source/youtube_transcript_chunks.jsonl.gz'
  RAW_SEARCH_BASE_CHANNELS_GZIP = '/data/source/youtube_youtubers.jsonl.gz'
  RAW_SEARCH_STATE_DIRECTORY = '/data/mutable'
  RUST_LOG = 'youtube_raw_search=info'

[http_service]
  internal_port = 8108
  force_https = true
  auto_stop_machines = 'off'
  # The production Cloudflare availability scheduler owns starts and stops.
  auto_start_machines = false
  min_machines_running = 0
  processes = ['app']

[mounts]
  source = 'raw_mutable_data'
  destination = '/data/mutable'
  initial_size = '20gb'

[[vm]]
  # Half the current Typesense production allocation (8 GB / 4 performance
  # CPUs). The full schema-v6 Raw generation warms below 400 MB RSS, leaving
  # substantial headroom for concurrency and page-cache growth.
  memory = '4096mb'
  cpu_kind = 'performance'
  cpus = 2

[checks]
  [checks.health]
    port = 8108
    type = 'http'
    interval = '15s'
    timeout = '2s'
    grace_period = '240s'
    method = 'get'
    path = '/health'
