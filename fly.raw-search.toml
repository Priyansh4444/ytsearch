app = 'ytsearch-raw-production'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile.raw-search'

[env]
  # Fly's private 6PN is IPv6. The unspecified IPv6 listener also accepts the
  # public Fly Proxy traffic routed to this service.
  RAW_SEARCH_BIND = '[::]:8108'
  RAW_SEARCH_INDEX_PATH = '/data/index'
  RAW_SEARCH_BASE_CHUNKS_GZIP = '/data/source/youtube_transcript_chunks.jsonl.gz'
  RAW_SEARCH_BASE_CHANNELS_GZIP = '/data/source/youtube_youtubers.jsonl.gz'
  RAW_SEARCH_STATE_DIRECTORY = '/data/mutable'
  # Two searches at once: +77% throughput for about 64 MB more peak memory
  # (docs/capacity.md).
  RAW_SEARCH_MAX_CONCURRENT_SEARCHES = '2'
  RUST_LOG = 'youtube_raw_search=info'

[http_service]
  internal_port = 8108
  force_https = true
  auto_stop_machines = 'off'
  # The production Cloudflare availability scheduler owns starts and stops.
  auto_start_machines = false
  min_machines_running = 0
  processes = ['app']

[mounts]
  source = 'raw_mutable_data'
  destination = '/data/mutable'
  initial_size = '20gb'

[[vm]]
  # Keep routine deploys aligned with the cost-gated live allocation. 2.5 GiB
  # holds two generations' scanned files and the mutation store in page cache
  # during publication; four vCPUs let broad scans partition (2026-09-27).
  memory = '2560mb'
  cpu_kind = 'shared'
  cpus = 4

[checks]
  [checks.health]
    port = 8108
    type = 'http'
    interval = '15s'
    timeout = '2s'
    grace_period = '240s'
    method = 'get'
    path = '/health'
