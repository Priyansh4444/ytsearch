name: Security

# Known-vulnerability audits for both lockfiles. They run when a lockfile
# changes and weekly, not on every PR, so an advisory published today does not
# fail unrelated work; the weekly run surfaces it instead.
on:
  pull_request:
    paths:
      - "bun.lock"
      - "package.json"
      - "Cargo.lock"
      - ".github/workflows/security.yml"
  push:
    branches: [master]
    paths:
      - "bun.lock"
      - "package.json"
      - "Cargo.lock"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "41 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: npm dependencies
        run: bun install --frozen-lockfile && bun audit
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-audit
      - name: Rust dependencies
        run: cargo audit
