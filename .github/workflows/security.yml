name: Security

# Known-vulnerability audits for both lockfiles. They run when a lockfile
# changes and weekly, not on every PR, so an advisory published today does not
# fail unrelated work; the weekly run surfaces it instead.
on:
  pull_request:
    paths:
      - "bun.lock"
      - "package.json"
      - "Cargo.lock"
      - ".github/workflows/security.yml"
  push:
    branches: [master]
    paths:
      - "bun.lock"
      - "package.json"
      - "Cargo.lock"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "41 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: npm dependencies
        run: bun install --frozen-lockfile && bun audit
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-audit
      - name: Rust dependencies
        run: cargo audit
