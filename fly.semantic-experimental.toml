# Experimental semantic-search site; not part of production. Stops when idle.
# See docs/playbooks/semantic-pilot.md ("Experimental Fly site").
app = 'ytsearch-semantic-experimental'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile.semantic-experimental'

[env]
  RUST_LOG = 'youtube_api=info'
  LOG_FORMAT = 'json'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = 'semantic_experimental_data'
  destination = '/data'
  initial_size = '1gb'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 2

[checks]
  [checks.health]
    port = 8080
    type = 'http'
    interval = '30s'
    timeout = '2s'
    grace_period = '30s'
    method = 'get'
    path = '/healthz'
