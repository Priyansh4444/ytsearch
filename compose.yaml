services:
  raw-search:
    build:
      context: .
      dockerfile: Dockerfile.raw-search-selfhost
    restart: unless-stopped
    ports:
      - "8108:8108"
    environment:
      RAW_SEARCH_ADMIN_API_KEY: ${RAW_SEARCH_ADMIN_API_KEY:?set RAW_SEARCH_ADMIN_API_KEY}
      RAW_SEARCH_API_KEY: ${RAW_SEARCH_API_KEY:?set RAW_SEARCH_API_KEY}
    volumes:
      - raw-mutable-data:/data/mutable
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/8108; printf 'GET /health HTTP/1.0\r\n\r\n' >&3; grep -q '\"ok\":true' <&3",
        ]
      interval: 10s
      timeout: 3s
      retries: 30

  api:
    build: .
    restart: unless-stopped
    depends_on:
      raw-search:
        condition: service_healthy
      init-backend:
        condition: service_completed_successfully
    ports:
      - "8787:8787"
    # The public API gets search-only credentials; admin keys, the YouTube key
    # and cookies belong to the indexing worker below.
    environment: &backend-environment
      YTSEARCH_API_ADDR: 0.0.0.0:8787
      RAW_SEARCH_API_URL: http://raw-search:8108
      RAW_SEARCH_API_KEY: ${RAW_SEARCH_API_KEY:?set RAW_SEARCH_API_KEY}
      RAW_SEARCH_COLLECTION: youtube_transcript_chunks
      YTSEARCH_INDEX_QUEUE_PATH: /queue/index-requests.jsonl
      YTSEARCH_INDEX_QUEUE_TOKEN: ${YTSEARCH_INDEX_QUEUE_TOKEN:?set YTSEARCH_INDEX_QUEUE_TOKEN}
    volumes:
      - queue-data:/queue
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 30

  init-backend:
    build: .
    command: ["ytsearch", "init-backend", "--backend", "raw"]
    restart: "no"
    depends_on:
      raw-search:
        condition: service_healthy
    environment:
      RAW_SEARCH_API_URL: http://raw-search:8108
      RAW_SEARCH_ADMIN_API_KEY: ${RAW_SEARCH_ADMIN_API_KEY:?set RAW_SEARCH_ADMIN_API_KEY}
      RAW_SEARCH_COLLECTION: youtube_transcript_chunks

  worker:
    build: .
    command: ["/bin/sh", "/usr/local/bin/cloud-index-queue"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *backend-environment
      RAW_SEARCH_ADMIN_API_KEY: ${RAW_SEARCH_ADMIN_API_KEY:?set RAW_SEARCH_ADMIN_API_KEY}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      YT_DLP_COOKIES_FILE: ${YT_DLP_COOKIES_FILE:-}
      INDEX_QUEUE_API_BASE_URL: http://api:8787
      BACKENDS: raw
      QUEUE_TARGET_BACKEND: raw
      QUEUE_LOOP: "1"
      QUEUE_POLL_INTERVAL_SECONDS: "30"
      QUEUE_ONE_REQUEST_PER_PASS: "1"
      DAILY_UPDATE_ENABLED: ${DAILY_UPDATE_ENABLED:-0}
      DAILY_UPDATE_INTERVAL_SECONDS: "86400"
      DAILY_UPDATE_INITIAL_DELAY_SECONDS: ${DAILY_UPDATE_INITIAL_DELAY_SECONDS:-86400}
      DAILY_UPDATE_LIST_FILE: /app/indexed-channels.txt
      TRANSCRIPT_CACHE_DIR: /data/transcript-cache
      JOBS: "1"
      RAW_JOBS: "1"
      ACK_FAILED_REQUESTS: "0"
    volumes:
      - transcript-cache:/data
      - ./scripts/indexed-channels.txt:/app/indexed-channels.txt:ro

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8787}
        VITE_INDEX_QUEUE_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8787}
        VITE_POSTHOG_KEY: ${VITE_POSTHOG_KEY:-}
        VITE_POSTHOG_HOST: ${VITE_POSTHOG_HOST:-https://us.i.posthog.com}
    restart: unless-stopped
    ports:
      - "3000:80"

volumes:
  raw-mutable-data:
  queue-data:
  transcript-cache:
